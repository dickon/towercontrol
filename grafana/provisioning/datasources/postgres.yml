apiVersion: 1

datasources:
  - name: TowerControl PostgreSQL
    type: postgres
    access: proxy
    url: localhost:5432
    database: towercontrol
    user: towercontrol
    secureJsonData:
      password: towercontrol
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600  # 16.x
      timescaledb: true
    isDefault: true
    editable: true
